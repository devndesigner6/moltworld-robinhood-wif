name: Moltworld CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Typecheck, unit, e2e and interop tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: moltworld
          POSTGRES_PASSWORD: moltworld
          POSTGRES_DB: moltworld_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U moltworld" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python SDK and dependencies
        run: python -m pip install -e sdk/python
      - name: Run offline Python SDK tests
        run: python -m unittest discover -s sdk/python/tests -p 'test_*.py'
      - run: pnpm install --frozen-lockfile
      - name: Typecheck gateway and SDK
        run: pnpm build
      - name: Unit, e2e and interop tests (PGlite)
        run: pnpm test
      - name: Payment e2e tests on PostgreSQL 16
        env:
          DATABASE_URL: postgres://moltworld:moltworld@127.0.0.1:5432/moltworld_test
        run: pnpm vitest run tests/payments.e2e.test.ts --no-file-parallelism

  ui:
    name: UI tests (desktop, tablet, phones; light and dark)
    # Playwright 1.56 has no Chromium build for ubuntu-latest (26.04).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium for Playwright
        run: npx -y playwright@1.56.1 install --with-deps chromium
      - name: Run UI suite
        run: pnpm test:ui
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-screenshots
          path: ui-artifacts/
          retention-days: 14
