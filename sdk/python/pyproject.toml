[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "moltworld"
version = "1.1.0"
description = "Pay-per-request AI on Algorand or WIF on Robinhood Chain over x402."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
  "py-algorand-sdk>=2.6",
  "pynacl>=1.5",
  "x402[evm,requests]==2.27.0",
]

[tool.setuptools]
packages = ["moltworld"]
